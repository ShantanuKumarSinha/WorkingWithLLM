spring.application.name=WorkingWithLLM

# OpenAI API key - set via environment variable SPRING_AI_OPENAI_API_KEY
# or replace the placeholder below with your actual key (do not commit secrets)
spring.ai.openai.api-key=${SPRING_AI_OPENAI_API_KEY:your-openai-api-key-here}

# Default model to use
spring.ai.openai.chat.options.model=gpt-4o-mini

# Default temperature (0.0 = deterministic, 1.0 = creative)
spring.ai.openai.chat.options.temperature=0.7

# Server port
server.port=8080
